<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#91a7b9">
<meta name="description" content="Zahnkultur AI – digitaler Assistent.">
<title>Zahnkultur AI 1.2</title>
<link rel="stylesheet" href="style.css?v=1.2">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <button id="menuBtn" class="menu-btn" type="button" aria-label="Menü öffnen">
      <span class="hamb"><i></i><i></i><i></i></span><span>MENU</span>
    </button>
    <div class="brand">
      <div class="brand-mark"><span>J</span><b>K</b></div>
      <div><strong>ZAHNKULTUR</strong><small>AI ASSISTENT</small></div>
    </div>
    <div class="version">1.2</div>
  </header>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <button id="closeMenu" class="drawer-close" type="button">×</button>
    <div class="drawer-brand"><div class="brand-mark large"><span>J</span><b>K</b></div><strong>ZAHNKULTUR AI</strong></div>
    <nav>
      <button id="newChat" type="button">Neuer Chat</button>
      <button id="pingBtnMenu" type="button">PING – Backend testen</button>
      <button id="aiTestBtnMenu" type="button">AI-TEST – KI testen</button>
      <button id="updateAppMenu" type="button">App aktualisieren</button>
    </nav>
    <div class="drawer-foot">Zahnkultur AI · Version 1.2</div>
  </aside>
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <main class="chat-app">
    <section class="chat-welcome">
      <div class="welcome-mark"><span>J</span><b>K</b></div>
      <div class="eyebrow">ZAHNKULTUR AI</div>
      <h1>Wie kann ich<br>helfen?</h1>
      <p>Ihr digitaler Assistent für Fragen rund um Zahnkultur.</p>
    </section>

    <section id="chatMessages" class="chat-messages" aria-live="polite"></section>

    <div class="chat-tools">
      <button data-q="Welche Leistungen bietet Zahnkultur an?">Leistungen</button>
      <button data-q="Welche Technologien verwendet die Praxis?">Technologie</button>
      <button data-q="Wie sind die Sprechzeiten?">Sprechzeiten</button>
      <button data-q="Wie kann ich einen Termin vereinbaren?">Termin</button>
    </div>

    <div class="notice">Der Assistent dient zur Information und ersetzt keine zahnärztliche Untersuchung.</div>

    <form id="chat" class="composer">
      <input id="input" autocomplete="off" placeholder="Nachricht schreiben …" required>
      <button type="submit" aria-label="Nachricht senden">↑</button>
    </form>
  </main>

  <div class="diagnostics">
    <span id="status">Bereit</span>
    <button id="pingBtn" type="button">PING</button>
    <button id="aiTestBtn" type="button">AI-TEST</button>
  </div>

  <footer><span>ZAHNKULTUR AI</span><span>·</span><span>1.2</span></footer>
</div>
<script src="app.js?v=1.2"></script>
</body>
</html>
